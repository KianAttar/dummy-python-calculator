[project]
name = "python-calculator"
version = "1.0.0"
description = "A comprehensive calculator with GUI and CLI supporting basic, scientific, and programmer modes"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["calculator", "gui", "cli", "scientific", "programmer"]
dependencies = [
    "pyside6>=6.10.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
